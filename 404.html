<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Redirecting...</title>
  <script>
    // GH Pages serves this file for unknown paths. Stash the requested
    // route and bounce to the app root; App.tsx restores the clean URL
    // via history.replaceState on first load.
    (function () {
      var p = location.pathname
      if (p.length > 1 && p.charAt(p.length - 1) === '/') p = p.slice(0, -1)
      sessionStorage.setItem('minex-datapack-checker-redirect', p + location.search)
      location.replace(p.slice(0, p.lastIndexOf('/') + 1))
    })()
  </script>
</head>
<body></body>
</html>
